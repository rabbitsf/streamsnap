<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Prevent flash of wrong theme before CSS loads -->
    <script>(function(){var t=localStorage.getItem('streamsnap-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
    <title>{% block title %}StreamSnap{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ── Dark theme tokens (default) ─────────────── */
        :root {
            --bg:         #080808;
            --surf:       #0E0E0E;
            --surf-2:     #161616;
            --surf-3:     #1E1E1E;
            --border:     #222222;
            --border-2:   #2E2E2E;
            --border-3:   #3A3A3A;
            --text:       #E2E2E2;
            --text-dim:   #999999;
            --text-muted: #555555;
            --snap:       #F0E040;
            --snap-dim:   #C0B030;
            --snap-glow:  rgba(240, 224, 64, 0.10);
            --green:      #4ADE80;
            --green-dim:  rgba(74, 222, 128, 0.15);
            --red:        #F87171;
            --red-dim:    rgba(248, 113, 113, 0.12);
            --blue:       #60A5FA;
            --purple:     #C084FC;
            --dot-color:  rgba(255,255,255,0.022);
            --nav-bg:     rgba(8,8,8,0.96);
        }

        /* ── Light theme tokens ──────────────────────── */
        [data-theme="light"] {
            --bg:         #F5F1EA;
            --surf:       #FFFFFF;
            --surf-2:     #F0EDE7;
            --surf-3:     #E5E1D8;
            --border:     #DDD8CF;
            --border-2:   #CEC9BF;
            --border-3:   #BDB8AE;
            --text:       #1A1916;
            --text-dim:   #3D3A35;
            --text-muted: #7A7469;
            --snap:       #B58900;
            --snap-dim:   #8A6800;
            --snap-glow:  rgba(181, 137, 0, 0.18);
            --green:      #15803D;
            --green-dim:  rgba(21, 128, 61, 0.12);
            --red:        #DC2626;
            --red-dim:    rgba(220, 38, 38, 0.10);
            --blue:       #2563EB;
            --purple:     #7C3AED;
            --dot-color:  rgba(0,0,0,0.055);
            --nav-bg:     rgba(245,241,234,0.96);
        }

        /* ── Smooth theme transition ─────────────────── */
        .theme-transitioning,
        .theme-transitioning *,
        .theme-transitioning *::before,
        .theme-transitioning *::after {
            transition:
                background-color 0.25s ease,
                color 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease !important;
        }

        /* ── Reset / base ────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            background-image: radial-gradient(
                circle at 1px 1px,
                var(--dot-color) 1px,
                transparent 0
            );
            background-size: 28px 28px;
            -webkit-font-smoothing: antialiased;
        }

        /* ── HTMX indicators ─────────────────────────── */
        .htmx-indicator { display: none !important; }
        .htmx-request .htmx-indicator { display: flex !important; }
        .htmx-request.htmx-indicator { display: flex !important; }

        /* ── Form elements ───────────────────────────── */
        input:not([type=radio]):not([type=checkbox]),
        textarea,
        select {
            background: var(--surf);
            border: 1px solid var(--border-2);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.875rem;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            border-radius: 2px;
        }
        input:not([type=radio]):not([type=checkbox]):focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--snap) !important;
            box-shadow: 0 0 0 3px var(--snap-glow);
        }
        input[type="radio"],
        input[type="checkbox"] {
            accent-color: var(--snap);
            cursor: pointer;
        }

        /* ── Buttons ─────────────────────────────────── */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: var(--snap);
            color: #000;
            font-family: 'DM Sans', sans-serif;
            font-weight: 700;
            font-size: 0.8125rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 13px 28px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
        }
        .btn-primary:hover:not(:disabled) {
            background: #fff060;
            box-shadow: 0 4px 24px rgba(240, 224, 64, 0.22);
        }
        [data-theme="light"] .btn-primary:hover:not(:disabled) {
            background: #D4A000;
            box-shadow: 0 4px 24px rgba(181, 137, 0, 0.30);
        }
        .btn-primary:active:not(:disabled) { transform: translateY(1px); }
        .btn-primary:disabled {
            background: var(--surf-3);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .btn-danger {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            color: var(--red);
            border: 1px solid rgba(248, 113, 113, 0.28);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 7px 14px;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.15s;
        }
        [data-theme="light"] .btn-danger {
            border-color: rgba(220, 38, 38, 0.28);
        }
        .btn-danger:hover:not(:disabled) {
            background: var(--red-dim);
            border-color: var(--red);
        }
        .btn-danger:disabled { opacity: 0.3; cursor: not-allowed; }

        .btn-ghost {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-2);
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 7px 14px;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-ghost:hover {
            color: var(--text-dim);
            border-color: var(--border-3);
        }

        .btn-dl {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            color: var(--snap);
            border: 1px solid rgba(240, 224, 64, 0.3);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 6px 12px;
            border-radius: 2px;
            text-decoration: none;
            transition: all 0.15s;
        }
        [data-theme="light"] .btn-dl {
            border-color: rgba(181, 137, 0, 0.35);
        }
        .btn-dl:hover {
            background: var(--snap-glow);
            border-color: var(--snap);
        }

        /* ── Tab buttons ─────────────────────────────── */
        .tab-btn {
            padding: 11px 22px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-muted);
            background: none;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
        }
        .tab-btn:hover { color: var(--text-dim); }
        .tab-btn.tab-active {
            color: var(--snap);
            border-bottom-color: var(--snap);
        }

        /* ── Spinner ─────────────────────────────────── */
        @keyframes s { to { transform: rotate(360deg); } }
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid var(--surf-3);
            border-top-color: var(--snap);
            border-radius: 50%;
            animation: s 0.65s linear infinite;
            flex-shrink: 0;
        }

        /* ── Animations ──────────────────────────────── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fade-up { animation: fadeUp 0.22s ease forwards; }

        /* ── Misc ────────────────────────────────────── */
        ::selection { background: rgba(240,224,64,0.18); }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--surf); }
        ::-webkit-scrollbar-thumb { background: var(--border-3); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #484848; }
        [data-theme="light"] ::-webkit-scrollbar-thumb:hover { background: #9A9488; }

        .label-tag {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 2px 7px;
            border-radius: 2px;
        }
        .label-video { background: rgba(96,165,250,0.12); color: var(--blue); }
        .label-audio { background: rgba(192,132,252,0.12); color: var(--purple); }

        .section-rule {
            border: none;
            border-top: 1px solid var(--border);
            margin: 0;
        }
    </style>
</head>
<body style="display:flex; flex-direction:column; min-height:100vh;">

    <!-- Nav -->
    <nav style="background:var(--nav-bg); border-bottom:1px solid var(--border); backdrop-filter:blur(10px); position:sticky; top:0; z-index:50;">
        <div style="max-width:960px; margin:0 auto; padding:0 24px; height:58px; display:flex; align-items:center; justify-content:space-between;">
            <a href="/" style="text-decoration:none; display:flex; align-items:baseline; gap:0; line-height:1;">
                <span style="font-family:'Bebas Neue',cursive; font-size:1.6rem; color:var(--snap); letter-spacing:0.06em;">STREAM</span><span style="font-family:'Bebas Neue',cursive; font-size:1.6rem; color:var(--text); letter-spacing:0.06em;">SNAP</span>
            </a>
            {% if user %}
            <div style="display:flex; align-items:center; gap:16px;">
                <a href="/history" style="font-size:0.7rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-muted); text-decoration:none; transition:color .15s;" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text-muted)'">History</a>
                <span style="color:var(--border-2);">·</span>
                <span style="font-family:'JetBrains Mono',monospace; font-size:0.68rem; color:var(--text-muted); letter-spacing:0.05em;">{{ user.username }}</span>
                <a href="/logout" style="font-size:0.7rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-muted); text-decoration:none; transition:color .15s;" onmouseover="this.style.color='var(--red)'" onmouseout="this.style.color='var(--text-muted)'">Logout</a>
                <button
                    id="theme-toggle"
                    onclick="toggleTheme()"
                    title="Toggle light / dark theme"
                    style="width:28px; height:28px; border-radius:2px; background:transparent; border:1px solid var(--border-2); color:var(--text-muted); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; padding:0;"
                    onmouseover="this.style.borderColor='var(--border-3)'; this.style.color='var(--text)'"
                    onmouseout="this.style.borderColor='var(--border-2)'; this.style.color='var(--text-muted)'"
                >
                    <svg id="icon-sun" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                    <svg id="icon-moon" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:none;">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>
            {% endif %}
        </div>
    </nav>

    <!-- Content -->
    <main style="max-width:960px; margin:0 auto; padding:40px 24px; flex:1; width:100%;">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer style="border-top:1px solid var(--border);">
        <div style="max-width:960px; margin:0 auto; padding:16px 24px; display:flex; align-items:center; justify-content:space-between;">
            <span style="font-family:'Bebas Neue',cursive; color:var(--border-3); letter-spacing:0.18em; font-size:0.8rem;">STREAMSNAP</span>
            <span style="font-family:'JetBrains Mono',monospace; font-size:0.65rem; color:var(--text-muted);">1000+ sites · yt-dlp powered</span>
        </div>
    </footer>

    <script>
    function toggleTheme() {
        var html = document.documentElement;
        var current = html.getAttribute('data-theme') || 'light';
        var next = current === 'dark' ? 'light' : 'dark';
        html.classList.add('theme-transitioning');
        html.setAttribute('data-theme', next);
        localStorage.setItem('streamsnap-theme', next);
        updateThemeIcons(next);
        setTimeout(function() { html.classList.remove('theme-transitioning'); }, 300);
    }

    function updateThemeIcons(theme) {
        var sun  = document.getElementById('icon-sun');
        var moon = document.getElementById('icon-moon');
        if (!sun || !moon) return;
        if (theme === 'dark') {
            sun.style.display  = '';
            moon.style.display = 'none';
        } else {
            sun.style.display  = 'none';
            moon.style.display = '';
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        updateThemeIcons(document.documentElement.getAttribute('data-theme') || 'light');
    });
    </script>

</body>
</html>
