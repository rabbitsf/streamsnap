<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StreamSnap{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: inline-block;
        }
        .htmx-request.htmx-indicator {
            display: inline-block;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <nav class="bg-gray-800 border-b border-gray-700">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/" class="text-xl font-bold text-blue-400">StreamSnap</a>
            {% if user %}
            <div class="flex items-center gap-4">
                <a href="/history" class="text-gray-300 hover:text-white">History</a>
                <span class="text-gray-500">|</span>
                <span class="text-gray-400">{{ user.username }}</span>
                <a href="/logout" class="text-red-400 hover:text-red-300">Logout</a>
            </div>
            {% endif %}
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-gray-800 mt-auto">
        <div class="max-w-6xl mx-auto px-4 py-4 text-center text-gray-500 text-sm">
            StreamSnap - Download videos from 1000+ sites
        </div>
    </footer>
</body>
</html>
