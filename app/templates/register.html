{% extends "base.html" %}

{% block title %}Register - StreamSnap{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16">
    <div class="bg-gray-800 rounded-lg p-8 shadow-lg">
        <h1 class="text-2xl font-bold text-center mb-6">Create Account</h1>

        {% if error %}
        <div class="bg-red-900/50 border border-red-500 text-red-300 px-4 py-3 rounded mb-4">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/register" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-300 mb-1">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    minlength="3"
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded focus:outline-none focus:border-blue-500 text-white"
                    placeholder="Choose a username"
                >
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    minlength="6"
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded focus:outline-none focus:border-blue-500 text-white"
                    placeholder="Choose a password (min 6 characters)"
                >
            </div>

            <div>
                <label for="confirm_password" class="block text-sm font-medium text-gray-300 mb-1">Confirm Password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    required
                    minlength="6"
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded focus:outline-none focus:border-blue-500 text-white"
                    placeholder="Confirm your password"
                >
            </div>

            <button
                type="submit"
                class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded transition-colors"
            >
                Create Account
            </button>
        </form>

        <p class="mt-6 text-center text-gray-400">
            Already have an account?
            <a href="/login" class="text-blue-400 hover:text-blue-300">Login</a>
        </p>
    </div>
</div>
{% endblock %}
