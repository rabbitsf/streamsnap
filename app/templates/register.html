{% extends "base.html" %}
{% block title %}Create Account — StreamSnap{% endblock %}

{% block content %}
<div style="display:flex; align-items:flex-start; justify-content:center; padding-top:60px;">
    <div style="width:100%; max-width:400px;">

        <!-- Wordmark -->
        <div style="margin-bottom:36px; text-align:center;">
            <div style="font-family:'Bebas Neue',cursive; font-size:2.8rem; line-height:1; letter-spacing:0.08em; margin-bottom:6px;">
                <span style="color:var(--snap);">STREAM</span><span style="color:var(--text);">SNAP</span>
            </div>
            <p style="font-size:0.75rem; color:var(--text-muted); letter-spacing:0.1em; text-transform:uppercase; font-weight:500;">Create your account</p>
        </div>

        <!-- Card -->
        <div style="background:var(--surf); border:1px solid var(--border-2); padding:32px; border-radius:2px;">

            {% if error %}
            <div style="background:var(--red-dim); border:1px solid rgba(248,113,113,0.3); padding:11px 14px; margin-bottom:20px; border-radius:2px; display:flex; align-items:center; gap:10px;">
                <svg width="14" height="14" fill="none" stroke="var(--red)" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink:0;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span style="font-size:0.8125rem; color:var(--red);">{{ error }}</span>
            </div>
            {% endif %}

            <form method="post" action="/register">
                <div style="margin-bottom:18px;">
                    <label for="username" style="display:block; font-size:0.7rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim); margin-bottom:8px;">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        minlength="3"
                        placeholder="Choose a username"
                        style="width:100%; padding:10px 14px; background:var(--surf-2); border:1px solid var(--border-2); color:var(--text); border-radius:2px; font-size:0.875rem;"
                    >
                </div>

                <div style="margin-bottom:18px;">
                    <label for="password" style="display:block; font-size:0.7rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim); margin-bottom:8px;">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        minlength="6"
                        placeholder="Min. 6 characters"
                        style="width:100%; padding:10px 14px; background:var(--surf-2); border:1px solid var(--border-2); color:var(--text); border-radius:2px; font-size:0.875rem;"
                    >
                </div>

                <div style="margin-bottom:24px;">
                    <label for="confirm_password" style="display:block; font-size:0.7rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim); margin-bottom:8px;">Confirm Password</label>
                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        required
                        minlength="6"
                        placeholder="Repeat your password"
                        style="width:100%; padding:10px 14px; background:var(--surf-2); border:1px solid var(--border-2); color:var(--text); border-radius:2px; font-size:0.875rem;"
                    >
                </div>

                <button type="submit" class="btn-primary">Create Account</button>
            </form>
        </div>

        <p style="text-align:center; margin-top:20px; font-size:0.8125rem; color:var(--text-muted);">
            Already have an account?
            <a href="/login" style="color:var(--snap); text-decoration:none; font-weight:500;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">Sign in</a>
        </p>

    </div>
</div>
{% endblock %}
